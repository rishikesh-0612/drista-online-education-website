<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./login-page.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,200;1,400;1,700;1,900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inknut Antiqua:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Irish Grover:wght@400&display=swap"
    />
  </head>
  <body>
    <div class="login-page">
      <div class="login-page-inner">
        <div class="frame-parent1">
          <div class="frame-wrapper1">
            <div class="r-1-wrapper">
              <img
                class="r-1-icon"
                loading="lazy"
                alt=""
                src="./public/r-1@2x.png"
              />
            </div>
          </div>
          <div class="frame-parent2">
            <div class="drisht-wrapper">
              <h1 class="drisht2">Drishtā</h1>
            </div>
            <div class="we-welcome-you">We Welcome You to Your Betterment</div>
          </div>
        </div>
      </div>
      <div class="frame-parent3">
        <div class="login-container">
          <b class="login2">Login</b>
        </div>
        <div class="frame-parent4">
          <div class="frame-parent5">
            <div class="username-wrapper">
              <i class="username">Username</i>
            </div>
            <img
              class="oip-1-icon"
              loading="lazy"
              alt=""
              src="./public/oip-1@2x.png"
            />
          </div>
          <div class="frame-parent6">
            <input class="frame-input" placeholder="Password" type="text" />

            <div class="forgot-password-parent">
              <i class="forgot-password">forgot password?</i>
              <i class="sign-up">
                <span>Sign</span>
                <span class="span"> </span>
                <span>up</span>
              </i>
            </div>
          </div>
        </div>
        <div class="frame-wrapper2">
          <button class="group-button">
            <div class="frame-child4"></div>
            <a class="login3">Login</a>
            <img class="arrow-icon" alt="" src="./public/arrow-1.svg" />
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
