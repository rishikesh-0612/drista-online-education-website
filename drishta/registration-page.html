<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./registration-page.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,200;1,400;1,700;1,900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inknut Antiqua:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Irish Grover:wght@400&display=swap"
    />
  </head>
  <body>
    <div class="registration-page">
      <section class="registration-page-inner">
        <div class="frame-parent7">
          <div class="drisht-container">
            <a class="drisht3">Drishtā</a>
            <div class="welcomes-you-to">Welcome’s you to your betterment</div>
          </div>
          <div class="create-your-drisht-id-wrapper">
            <h1 class="create-your-drisht-container">
              <i class="create-your">Create Your </i>
              <span class="drisht4">Drishtā</span>
              <span class="id">
                <i class="i"> </i>
                <span class="id1">ID</span>
              </span>
            </h1>
          </div>
        </div>
      </section>
      <form class="frame-form">
        <div class="frame-parent8">
          <div class="frame-parent9">
            <input
              class="frame-child5"
              placeholder="Enter your Username:-"
              type="text"
            />

            <div class="frame-child6"></div>
          </div>
          <div class="frame-parent10">
            <input
              class="frame-child7"
              placeholder="Enter your name:-"
              type="text"
            />

            <div class="frame-child8"></div>
          </div>
          <div class="frame-wrapper3">
            <div class="frame-parent11">
              <div class="enter-your-password-wrapper">
                <div class="enter-your-password-">Enter your Password:-</div>
              </div>
              <div class="frame-child9"></div>
            </div>
          </div>
          <div class="frame-parent12">
            <input
              class="frame-child10"
              placeholder="Confirm your Password:-"
              type="text"
            />

            <div class="frame-child11"></div>
          </div>
        </div>
        <div class="frame-wrapper4">
          <button class="rectangle-parent3">
            <div class="frame-child12"></div>
            <div class="signup4">Signup</div>
            <img class="frame-child13" alt="" src="./public/arrow-1.svg" />
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
